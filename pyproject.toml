[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-scan"   # PyPI name (sieve was taken); the module and the command are still `sieve`
dynamic = ["version"]
description = "Find the CVEs that matter on a Linux box and its running containers, using OSV.dev, CISA KEV and EPSS."
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [{name = "casareanderson"}]
requires-python = ">=3.10"
dependencies = ["requests>=2.25"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4.18"]   # jsonschema: SBOM schema checks in tests only

[project.urls]
Homepage = "https://github.com/casareanderson/sieve"

[project.scripts]
sieve = "sieve.cli:main"

[tool.setuptools]
packages = ["sieve"]

[tool.setuptools.dynamic]
version = {attr = "sieve.__version__"}
