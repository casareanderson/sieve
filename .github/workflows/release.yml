name: release
# Tag vX.Y.Z -> tests -> build -> publish to PyPI via Trusted Publishing (OIDC, no API token).
# One-time setup on pypi.org (Manage > Publishing > add a pending publisher):
#   project: sieve-scan | owner: casareanderson | repo: sieve | workflow: release.yml | environment: pypi
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test] build
      - name: tag must match sieve.__version__
        run: |
          v=$(python -c "import sieve; print(sieve.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
